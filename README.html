<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nuestra Canción ❤️</title><style>
:root{
--bg:#000000;
--terminal:#7CFF7C;
--text:#f5f5f5;
--glow:rgba(124,255,124,.5);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
color:var(--text);
font-family:Consolas, monospace;
overflow:hidden;
height:100vh;
}

/* =========================
PANTALLA INICIAL
========================= */

#welcome{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:#000;
z-index:100;
transition:1s;
}

#welcome.hidden{
opacity:0;
pointer-events:none;
}

h1{
font-size:2rem;
margin-bottom:20px;
}

.start-btn{
padding:14px 30px;
background:#111;
color:white;
border:1px solid #444;
cursor:pointer;
border-radius:8px;
transition:.3s;
}

.start-btn:hover{
background:#1b1b1b;
}

/* =========================
APP
========================= */

#app{
opacity:0;
transition:1s;
height:100vh;
display:flex;
flex-direction:column;
}

#app.show{
opacity:1;
}

.song-title{
padding:15px;
font-size:.9rem;
color:#aaa;
border-bottom:1px solid #222;
}

/* =========================
ASCII
========================= */

#ascii{
color:var(--terminal);
font-size:clamp(8px,1.6vw,18px);
line-height:1;
white-space:pre;
padding:20px;
text-shadow:
0 0 5px var(--glow),
0 0 20px var(--glow);
overflow:hidden;
min-height:250px;
}

/* =========================
LETRAS
========================= */

#lyrics{
flex:1;
overflow-y:auto;
padding:20px;
}

.line{
opacity:.45;
margin-bottom:15px;
transition:.5s;
font-size:1rem;
line-height:1.7;
}

.line.active{
opacity:1;
}

.cursor{
display:inline-block;
animation:blink .8s infinite;
}

@keyframes blink{
50%{
opacity:0;
}
}

/* =========================
PARTÍCULAS
========================= */

canvas{
position:fixed;
inset:0;
pointer-events:none;
z-index:-1;
}

@media(max-width:768px){

#ascii{
font-size:7px;
padding:15px;
}

.line{
font-size:.95rem;
}

}
</style></head>
<body><canvas id="particles"></canvas>

<!-- =========================
CAMBIAR AQUÍ MP3
========================= --><audio id="audio">
<source src="tu-cancion.mp3" type="audio/mpeg">
</audio><div id="welcome"><h1>Para ti ❤️</h1><button class="start-btn" id="startBtn">
Iniciar experiencia
</button></div><div id="app"><div class="song-title">
El Cuarteto de Nos - Enamorado Tuyo
</div><pre id="ascii"></pre><div id="lyrics"></div></div><script>

/* ==========================================
CAMBIAR FRASES ASCII AQUÍ
========================================== */

const asciiFrames = [

`███████╗███╗   ███╗ ██████╗
██╔════╝████╗ ████║██╔═══██╗
█████╗  ██╔████╔██║██║   ██║
██╔══╝  ██║╚██╔╝██║██║   ██║
███████╗██║ ╚═╝ ██║╚██████╔╝
╚══════╝╚═╝     ╚═╝ ╚═════╝`,

`███╗   ███╗██╗
████╗ ████║██║
██╔████╔██║██║
██║╚██╔╝██║██║
██║ ╚═╝ ██║██║
╚═╝     ╚═╝╚═╝`,

`██████╗ ██████╗ ██████╗
██╔══██╗██╔══██╗██╔══██╗
██████╔╝██████╔╝██████╔╝
██╔═══╝ ██╔══██╗██╔═══╝
██║     ██║  ██║██║
╚═╝     ╚═╝  ╚═╝╚═╝`

];

/* ==========================================
CAMBIAR LETRAS AQUÍ
========================================== */

const lyrics = [

{time:0,text:"Y eso no significa que tenga un significado"},
{time:5,text:"Si pensás que amor yo siento, por favor no hagas pamento"},
{time:12,text:"No me vengas con historias que no van"},
{time:18,text:"Porque no estoy enamorado"},
{time:24,text:"Pero cada vez que te veo me haces falta"}

];

/* ==========================================
CONFIG
========================================== */

const TYPE_SPEED = 40;

/* ==========================================
INICIO
========================================== */

const startBtn = document.getElementById("startBtn");
const audio = document.getElementById("audio");
const app = document.getElementById("app");
const welcome = document.getElementById("welcome");

startBtn.onclick = async()=>{

try{
await audio.play();
}catch(e){}

welcome.classList.add("hidden");
app.classList.add("show");

};

/* ==========================================
ASCII ROTATIVO
========================================== */

const ascii = document.getElementById("ascii");
let frame = 0;

ascii.textContent = asciiFrames[0];

setInterval(()=>{

frame++;
ascii.textContent =
asciiFrames[frame % asciiFrames.length];

},5000);

/* ==========================================
TYPEWRITER
========================================== */

const lyricsBox =
document.getElementById("lyrics");

let currentIndex = -1;

function writeLine(text){

const div =
document.createElement("div");

div.className = "line active";

lyricsBox.appendChild(div);

let i=0;

function type(){

if(i < text.length){

div.textContent += text[i];
i++;

setTimeout(type,TYPE_SPEED);

}else{

div.innerHTML +=
'<span class="cursor">|</span>';

}

}

type();

lyricsBox.scrollTop =
lyricsBox.scrollHeight;

}

audio.addEventListener("timeupdate",()=>{

const current =
Math.floor(audio.currentTime);

const index =
lyrics.findIndex((item,next)=>{

const nextTime =
lyrics[next+1]?.time ?? 99999;

return current >= item.time &&
current < nextTime;

});

if(index !== -1 &&
index !== currentIndex){

currentIndex = index;

writeLine(
lyrics[index].text
);

}

});

/* ==========================================
PARTÍCULAS
========================================== */

const canvas =
document.getElementById("particles");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

const particles=[];

for(let i=0;i<50;i++){

particles.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,

r:Math.random()*1.5,

v:Math.random()*0.5+0.2

});

}

function animate(){

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

ctx.fillStyle =
"rgba(124,255,124,.25)";

particles.forEach(p=>{

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.r,
0,
Math.PI*2
);

ctx.fill();

p.y += p.v;

if(p.y > canvas.height){

p.y = 0;
p.x =
Math.random()*canvas.width;

}

});

requestAnimationFrame(
animate
);

}

animate();

</script></body>
</html>
