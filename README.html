<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia Musical Inmersiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #7CFF7C;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* FONDO CON PARTÍCULAS SUTILES */
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #7CFF7C;
            opacity: 0.1;
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0.1;
            }
            50% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) translateX(20px);
                opacity: 0;
            }
        }

        /* PANTALLA DE INICIO */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }

        .welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .welcome-title {
            font-size: clamp(2rem, 8vw, 5rem);
            color: #7CFF7C;
            text-shadow: 0 0 20px #7CFF7C, 0 0 40px #7CFF7C;
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .welcome-subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: #ffffff;
            margin-bottom: 3rem;
            text-align: center;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        .start-button {
            padding: 1rem 3rem;
            font-size: 1.2rem;
            background: transparent;
            border: 2px solid #7CFF7C;
            color: #7CFF7C;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px #7CFF7C;
            position: relative;
            overflow: hidden;
        }

        .start-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #7CFF7C;
            transition: left 0.3s ease;
            z-index: -1;
        }

        .start-button:hover {
            color: #0a0a0a;
            box-shadow: 0 0 20px #7CFF7C, inset 0 0 10px #7CFF7C;
        }

        .start-button:hover::before {
            left: 0;
        }

        .start-button:active {
            transform: scale(0.98);
        }

        /* EXPERIENCIA PRINCIPAL */
        .experience-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in, visibility 0.8s ease-in;
        }

        .experience-container.active {
            opacity: 1;
            visibility: visible;
        }

        .lyrics-display {
            text-align: center;
            max-width: 95vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        .ascii-text {
            font-size: clamp(2rem, 12vw, 8rem);
            color: #7CFF7C;
            font-weight: bold;
            text-shadow: 
                0 0 10px #7CFF7C,
                0 0 20px #7CFF7C,
                0 0 30px #7CFF7C,
                0 0 40px #00ff00,
                inset 0 0 10px rgba(124, 255, 124, 0.3);
            line-height: 1.2;
            letter-spacing: 2px;
            animation: fadeInAscii 1s ease-in;
            word-break: break-word;
            font-family: 'Courier New', monospace;
        }

        @keyframes fadeInAscii {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOutAscii {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        .ascii-text.fade-out {
            animation: fadeOutAscii 0.8s ease-out;
        }

        .spanish-translation {
            font-size: clamp(0.9rem, 3vw, 2rem);
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 1px;
            animation: fadeInSpanish 1.5s ease-in 0.3s both;
            font-style: italic;
            opacity: 0.9;
        }

        @keyframes fadeInSpanish {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.9;
            }
        }

        .spanish-translation.fade-out {
            animation: fadeOutSpanish 0.8s ease-out forwards;
        }

        @keyframes fadeOutSpanish {
            from {
                opacity: 0.9;
            }
            to {
                opacity: 0;
            }
        }

        /* CONTROLES DE MÚSICA */
        .music-controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 60;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .experience-container.active .music-controls {
            opacity: 0.8;
        }

        .music-controls:hover {
            opacity: 1;
        }

        .control-button {
            width: 50px;
            height: 50px;
            background: transparent;
            border: 2px solid #7CFF7C;
            color: #7CFF7C;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(124, 255, 124, 0.5);
        }

        .control-button:hover {
            box-shadow: 0 0 20px #7CFF7C;
            transform: scale(1.1);
        }

        .control-button:active {
            transform: scale(0.95);
        }

        /* PROGRESS BAR */
        .progress-container {
            position: fixed;
            bottom: 6rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            height: 4px;
            background: rgba(124, 255, 124, 0.2);
            border-radius: 2px;
            z-index: 60;
            opacity: 0;
            transition: opacity 0.5s ease;
            cursor: pointer;
        }

        .experience-container.active .progress-container {
            opacity: 0.8;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, #7CFF7C, #00ff00);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .lyrics-display {
                gap: 1rem;
            }

            .music-controls {
                bottom: 1rem;
            }

            .progress-container {
                bottom: 5rem;
                width: 95%;
            }
        }

        /* GLITCH EFFECT OPCIONAL */
        @keyframes glitch {
            0% {
                text-shadow: 
                    0 0 10px #7CFF7C,
                    0 0 20px #7CFF7C,
                    0 0 30px #7CFF7C,
                    0 0 40px #00ff00;
            }
            100% {
                text-shadow: 
                    0 0 10px #7CFF7C,
                    0 0 20px #7CFF7C,
                    0 0 30px #7CFF7C,
                    0 0 40px #00ff00,
                    inset 0 0 10px rgba(124, 255, 124, 0.5);
            }
        }
    </style>
</head>
<body>
    <!-- PANTALLA DE INICIO -->
    <div class="welcome-screen" id="welcomeScreen">
        <h1 class="welcome-title">▌ SYMPHONIA ▐</h1>
        <p class="welcome-subtitle">Una experiencia musical inmersiva</p>
        <button class="start-button" id="startBtn">INICIAR EXPERIENCIA</button>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="experience-container" id="experienceContainer">
        <div class="particle-container" id="particleContainer"></div>
        
        <div class="lyrics-display" id="lyricsDisplay">
            <div class="ascii-text" id="asciiText"></div>
            <div class="spanish-translation" id="spanishText"></div>
        </div>

        <!-- CONTROLES INFERIORES -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="music-controls">
            <button class="control-button" id="playPauseBtn" title="Reproducir/Pausar">▶</button>
            <button class="control-button" id="resetBtn" title="Reiniciar">⟲</button>
        </div>
    </div>

    <!-- ========================================
         CAMBIAR AQUÍ TU CANCIÓN
         ======================================== -->
    <audio id="audioPlayer">
        <source src="https://www.dropbox.com/scl/fi/hejj6odhqqdduxl922vgj/Baila-conmigo...-_shilohdynasty-_dedicarvideos-_jungkook-_heather-_parati-_michico-MP3-1.mp3?rlkey=ujhdxebqa85yx30p60irz7df4&st=emjsspmj&dl=0" type="audio/mpeg">
        Tu navegador no soporta reproducción de audio.
    </audio>

    <script>
        // ========================================
        // CONFIGURACIÓN DE LETRAS - EDITA AQUÍ
        // ========================================
        const lyrics = [
            {
                time: 0,
                ascii: "DANCE\nWITH ME",
                spanish: "Baila conmigo"
            },
            {
                time: 4,
                ascii: "I'LL SING\nTO YOU",
                spanish: "Y te cantaré"
            },
            {
                time: 8,
                ascii: "A\nSYMPHONY",
                spanish: "Una sinfonía"
            },
            {
                time: 12,
                ascii: "WON'T YOU\nKISS ME?",
                spanish: "¿No me besarás?"
            },
            {
                time: 16,
                ascii: "SHUT ME UP\nPLEASE",
                spanish: "Cállame por favor"
            },
            {
                time: 20,
                ascii: "SHE'S A\nGODDESS",
                spanish: "Es una diosa"
            },
            {
                time: 24,
                ascii: "A WISH FROM\nTHE STARS",
                spanish: "Un deseo de las estrellas"
            },
            {
                time: 28,
                ascii: "IN MY\nHEART",
                spanish: "En mi corazón"
            }
        ];

        // ========================================
        // ELEMENTOS DEL DOM
        // ========================================
        const audio = document.getElementById('audioPlayer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const experienceContainer = document.getElementById('experienceContainer');
        const startBtn = document.getElementById('startBtn');
        const asciiText = document.getElementById('asciiText');
        const spanishText = document.getElementById('spanishText');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const particleContainer = document.getElementById('particleContainer');

        // ========================================
        // VARIABLES DE ESTADO
        // ========================================
        let currentLyricIndex = -1;
        let isPlaying = false;

        // ========================================
        // CREAR PARTÍCULAS PARA EL FONDO
        // ========================================
        function createParticles() {
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDuration = (3 + Math.random() * 4) + 's';
                particle.style.animationDelay = Math.random() * 2 + 's';
                particleContainer.appendChild(particle);
            }
        }

        // ========================================
        // INICIALIZAR PARTÍCULAS
        // ========================================
        createParticles();

        // ========================================
        // FUNCIÓN PARA ACTUALIZAR LETRAS
        // ========================================
        function updateLyrics() {
            const currentTime = audio.currentTime;
            let nextLyricIndex = -1;

            // Encontrar la siguiente letra basada en el tiempo actual
            for (let i = 0; i < lyrics.length; i++) {
                if (currentTime >= lyrics[i].time) {
                    nextLyricIndex = i;
                }
            }

            // Si cambió la letra actual
            if (nextLyricIndex !== currentLyricIndex) {
                // Fade out de la letra anterior
                if (currentLyricIndex !== -1) {
                    asciiText.classList.add('fade-out');
                    spanishText.classList.add('fade-out');
                }

                currentLyricIndex = nextLyricIndex;

                // Esperar a que termine la animación de fade out
                setTimeout(() => {
                    if (currentLyricIndex !== -1) {
                        // Mostrar nueva letra
                        asciiText.textContent = lyrics[currentLyricIndex].ascii;
                        spanishText.textContent = lyrics[currentLyricIndex].spanish;

                        // Remover animación de fade out y añadir fade in
                        asciiText.classList.remove('fade-out');
                        spanishText.classList.remove('fade-out');
                    }
                }, 300);
            }
        }

        // ========================================
        // ACTUALIZAR PROGRESO DE LA CANCIÓN
        // ========================================
        function updateProgress() {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = progress + '%';
        }

        // ========================================
        // EVENTOS DE AUDIO
        // ========================================
        audio.addEventListener('timeupdate', () => {
            updateLyrics();
            updateProgress();
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            playPauseBtn.textContent = '▶';
            currentLyricIndex = -1;
            asciiText.textContent = '';
            spanishText.textContent = '';
        });

        // ========================================
        // BOTÓN INICIO
        // ========================================
        startBtn.addEventListener('click', () => {
            welcomeScreen.classList.add('hidden');
            experienceContainer.classList.add('active');
            
            setTimeout(() => {
                audio.play();
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
            }, 800);
        });

        // ========================================
        // BOTÓN PLAY/PAUSE
        // ========================================
        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playPauseBtn.textContent = '▶';
            } else {
                audio.play();
                playPauseBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        });

        // ========================================
        // BOTÓN RESET
        // ========================================
        resetBtn.addEventListener('click', () => {
            audio.currentTime = 0;
            currentLyricIndex = -1;
            asciiText.textContent = '';
            spanishText.textContent = '';
            if (isPlaying) {
                audio.play();
            }
        });

        // ========================================
        // CLICK EN LA BARRA DE PROGRESO
        // ========================================
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        // ========================================
        // EFECTO GLITCH SUAVE EN TRANSICIONES
        // ========================================
        setInterval(() => {
            if (isPlaying && currentLyricIndex !== -1) {
                // Efecto sutil de brillo pulsante
                if (Math.random() > 0.98) {
                    asciiText.style.opacity = 0.95;
                    setTimeout(() => {
                        asciiText.style.opacity = 1;
                    }, 50);
                }
            }
        }, 500);
    </script>
</body>
</html>
