<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Ti ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#050816;
overflow:hidden;
height:100vh;
color:white;
}

.screen{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
transition:1.2s ease;
}

.hidden{
opacity:0;
pointer-events:none;
}

.visible{
opacity:1;
pointer-events:auto;
}

.bg-glow{
position:absolute;
width:500px;
height:500px;
border-radius:50%;
background:radial-gradient(circle,#ff4fd8,#4fc3ff);
filter:blur(180px);
opacity:.25;
animation:floatGlow 8s ease-in-out infinite;
}

@keyframes floatGlow{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-40px)}
}

/* ==========================
FASE 1
========================== */

.hero{
text-align:center;
z-index:2;
}

.heart-container{
width:180px;
height:180px;
position:relative;
margin:auto;
margin-bottom:30px;
animation:floatHeart 4s ease-in-out infinite;
}

@keyframes floatHeart{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-15px)}
}

.big-heart{
width:100%;
height:100%;
background:linear-gradient(135deg,#ff4fa5,#ff80df);
position:absolute;
transform:rotate(-45deg);
border-radius:25px;
}

.big-heart::before,
.big-heart::after{
content:"";
position:absolute;
width:100%;
height:100%;
background:inherit;
border-radius:50%;
}

.big-heart::before{
top:-50%;
left:0;
}

.big-heart::after{
left:50%;
top:0;
}

.title{
font-family:'Dancing Script',cursive;
font-size:3rem;
margin-bottom:25px;
}

.btn{
border:none;
padding:16px 35px;
border-radius:40px;
cursor:pointer;
font-size:1rem;
background:linear-gradient(135deg,#ff5fd2,#6ec8ff);
color:white;
font-weight:600;
box-shadow:0 0 25px rgba(255,255,255,.2);
transition:.3s;
}

.btn:hover{
transform:translateY(-4px);
}

/* ==========================
FASE 2
========================== */

.unlock-title{
font-size:1.1rem;
text-align:center;
margin-bottom:35px;
}

.fingerprint-wrapper{
position:relative;
width:220px;
height:220px;
display:flex;
justify-content:center;
align-items:center;
}

.progress-ring{
position:absolute;
width:220px;
height:220px;
transform:rotate(-90deg);
}

.progress-ring circle{
fill:none;
stroke-width:8;
stroke-linecap:round;
}

.bg-ring{
stroke:rgba(255,255,255,.15);
}

.progress{
stroke:url(#gradient);
stroke-dasharray:628;
stroke-dashoffset:628;
transition:.05s linear;
}

.fingerprint{
font-size:90px;
cursor:pointer;
user-select:none;
transition:.2s;
}

.fingerprint.holding{
transform:scale(1.15);
filter:drop-shadow(0 0 20px #ff78e8);
}

/* ==========================
PARTICULAS
========================== */

#particles{
position:absolute;
inset:0;
pointer-events:none;
}

/* ==========================
FASE 3
========================== */

#petals{
position:absolute;
inset:0;
z-index:0;
}

.glass{
width:min(95%,850px);
max-height:85vh;
overflow:auto;
padding:25px;
border-radius:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 0 40px rgba(255,255,255,.1);
z-index:2;
}

.love-title{
font-family:'Dancing Script',cursive;
font-size:3rem;
text-align:center;
margin-bottom:20px;
}

.typewriter{
line-height:1.9;
font-size:1rem;
min-height:260px;
white-space:pre-wrap;
}

.cursor{
display:inline-block;
width:2px;
background:white;
animation:blink .8s infinite;
}

@keyframes blink{
50%{
opacity:0;
}
}

/* ==========================
CARRUSEL
========================== */

.carousel{
margin-top:35px;
position:relative;
}

.carousel img{
width:100%;
border-radius:20px;
height:320px;
object-fit:cover;
}

.controls{
display:flex;
justify-content:center;
gap:15px;
margin-top:15px;
}

.controls button{
width:45px;
height:45px;
border:none;
border-radius:50%;
cursor:pointer;
background:rgba(255,255,255,.15);
color:white;
font-size:1.2rem;
}

@media(max-width:600px){

.title{
font-size:2.4rem;
}

.love-title{
font-size:2.4rem;
}

.carousel img{
height:250px;
}

}

</style>
</head>
<body>

<audio id="bgMusic" loop>
    <!-- CAMBIAR AQUÍ TU CANCIÓN -->
    <source src="tu-cancion.mp3" type="audio/mpeg">
</audio>

<!-- =====================
FASE 1
===================== -->

<section id="screen1" class="screen visible">

<div class="bg-glow"></div>

<div class="hero">

<div class="heart-container">
<div class="big-heart"></div>
</div>

<h1 class="title">Para ti, mi amor ❤️</h1>

<button class="btn" id="startBtn">
Iniciar Experiencia
</button>

</div>

</section>

<!-- =====================
FASE 2
===================== -->

<section id="screen2" class="screen hidden">

<div class="bg-glow"></div>

<h2 class="unlock-title">
Mantén presionada la huella para desbloquear nuestro espacio ✨
</h2>

<div class="fingerprint-wrapper">

<svg class="progress-ring">
<defs>
<linearGradient id="gradient">
<stop offset="0%" stop-color="#ff6ed8"/>
<stop offset="100%" stop-color="#64cfff"/>
</linearGradient>
</defs>

<circle class="bg-ring" cx="110" cy="110" r="100"></circle>
<circle class="progress" cx="110" cy="110" r="100"></circle>
</svg>

<div class="fingerprint" id="fingerprint">
💖
</div>

</div>

</section>

<canvas id="particles"></canvas>

<!-- =====================
FASE 3
===================== -->

<section id="screen3" class="screen hidden">

<canvas id="petals"></canvas>

<div class="glass">

<h2 class="love-title">Nuestra Historia ❤️</h2>

<div id="typedText" class="typewriter">
<span class="cursor"></span>
</div>

<div class="carousel">

<!-- CAMBIAR AQUÍ LAS FOTOS -->

<img id="carouselImage"
src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800">

<div class="controls">
<button id="prev">❮</button>
<button id="next">❯</button>
</div>

</div>

</div>

</section>

<script>

/* =====================================
CAMBIAR AQUÍ EL TEXTO DE LA CARTA
===================================== */

const loveLetter = `
Mi amor...

Si estás leyendo esto, es porque una vez más llegaste hasta mi corazón.

Quiero que sepas que eres una de las personas más importantes que han llegado a mi vida.

Gracias por cada sonrisa, por cada conversación, por cada momento compartido y por todos esos instantes que conviertes en recuerdos inolvidables.

A veces las palabras parecen quedarse cortas para describir todo lo que siento por ti.

Pero aun así quiero intentarlo.

Me encanta tu forma de ser.
Me encanta tu sonrisa.
Me encanta cómo haces que incluso los días más simples se vuelvan especiales.

Gracias por existir.
Gracias por quedarte.
Gracias por elegirme.

Y si algún día dudas de cuánto te amo, vuelve a leer esta carta y recuerda que siempre tendrás un lugar especial dentro de mi corazón.

Te amo infinitamente ❤️
`;

/* =====================================
FASES
===================================== */

const screen1 = document.getElementById("screen1");
const screen2 = document.getElementById("screen2");
const screen3 = document.getElementById("screen3");

document.getElementById("startBtn").onclick = () => {

document.getElementById("bgMusic").play();

screen1.classList.replace("visible","hidden");

setTimeout(()=>{
screen2.classList.replace("hidden","visible");
},600);

};

/* =====================================
DESBLOQUEO
===================================== */

const fingerprint = document.getElementById("fingerprint");
const progress = document.querySelector(".progress");

let holdTimer;
let progressValue = 0;
let completed = false;

function startHold(){

if(completed) return;

fingerprint.classList.add("holding");

holdTimer = setInterval(()=>{

progressValue += 1.6;

const offset = 628 - (628 * progressValue / 100);

progress.style.strokeDashoffset = offset;

if(progressValue >= 100){

clearInterval(holdTimer);

completed = true;

explodeParticles();

setTimeout(showFinalScreen,1000);

}

},30);

}

function stopHold(){

if(completed) return;

clearInterval(holdTimer);

progressValue = 0;

progress.style.strokeDashoffset = 628;

fingerprint.classList.remove("holding");

}

fingerprint.addEventListener("mousedown",startHold);
fingerprint.addEventListener("mouseup",stopHold);
fingerprint.addEventListener("mouseleave",stopHold);

fingerprint.addEventListener("touchstart",startHold);
fingerprint.addEventListener("touchend",stopHold);

/* =====================================
PARTÍCULAS
===================================== */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

function explodeParticles(){

let particles=[];

for(let i=0;i<150;i++){

particles.push({

x:innerWidth/2,
y:innerHeight/2,

vx:(Math.random()-0.5)*12,
vy:(Math.random()-0.5)*12,

size:Math.random()*6+2,
life:100

});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach((p,index)=>{

p.x+=p.vx;
p.y+=p.vy;
p.life--;

ctx.fillStyle=`rgba(255,120,220,${p.life/100})`;

ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fill();

if(p.life<=0){
particles.splice(index,1);
}

});

if(particles.length){
requestAnimationFrame(animate);
}

}

animate();

}

/* =====================================
FASE FINAL
===================================== */

function showFinalScreen(){

screen2.classList.replace("visible","hidden");

setTimeout(()=>{

screen3.classList.replace("hidden","visible");

startTyping();

startPetals();

},700);

}

/* =====================================
TYPEWRITER
===================================== */

function startTyping(){

const container = document.getElementById("typedText");

container.innerHTML="";

let i=0;

const cursor=document.createElement("span");
cursor.className="cursor";

function type(){

if(i<loveLetter.length){

container.innerHTML += loveLetter.charAt(i);

i++;

setTimeout(type,45);

}else{

container.appendChild(cursor);

}

}

type();

}

/* =====================================
CARRUSEL
===================================== */

const images = [

"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800",

"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=800",

"https://images.unsplash.com/photo-1511988617509-a57c8a288659?w=800",

"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800"

];

let current = 0;

const img = document.getElementById("carouselImage");

function updateImage(){
img.src = images[current];
}

document.getElementById("next").onclick=()=>{
current=(current+1)%images.length;
updateImage();
}

document.getElementById("prev").onclick=()=>{
current=(current-1+images.length)%images.length;
updateImage();
}

setInterval(()=>{
current=(current+1)%images.length;
updateImage();
},4500);

/* =====================================
LLUVIA DE CORAZONES
===================================== */

function startPetals(){

const canvas=document.getElementById("petals");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

const hearts=[];

for(let i=0;i<45;i++){

hearts.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,

size:Math.random()*15+10,
speed:Math.random()*1.5+0.5

});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

hearts.forEach(h=>{

ctx.fillStyle="rgba(255,180,220,.7)";
ctx.font=h.size+"px Arial";

ctx.fillText("❤",h.x,h.y);

h.y+=h.speed;

if(h.y>canvas.height+20){

h.y=-20;
h.x=Math.random()*canvas.width;

}

});

requestAnimationFrame(draw);

}

draw();

}

window.addEventListener("resize",()=>{

canvas.width=innerWidth;
canvas.height=innerHeight;

});

</script>

</body>
</html>
